# Push a version tag (for example v0.2.0) to build the Windows, macOS and Linux installers and publish them
# as a GitHub release. See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            dist: yarn dist:win --x64
          # Built, signed and notarised in its own steps below.
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
            dist: yarn dist:linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in package.json"
            exit 1
          fi

      - run: yarn typecheck
      # The askpass test runs the built helper, so build first.
      - run: yarn build
      - run: yarn test

      - name: Build installers
        if: runner.os != 'macOS'
        shell: bash
        run: ${{ matrix.dist }} --publish never

      # A Mac build without the certificate could never update itself, so it must not be released.
      # forceCodeSigning stops the build if the certificate isn't a Developer ID Application one, instead
      # of leaving the apps unsigned.
      - name: Build, sign, and notarise the Mac apps
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for pair in MAC_CERTIFICATE:CSC_LINK MAC_CERTIFICATE_PASSWORD:CSC_KEY_PASSWORD APPLE_ID:APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD:APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID:APPLE_TEAM_ID; do
            variable=${pair#*:}
            if [ -z "${!variable}" ]; then
              echo "::error::The repository secret ${pair%%:*} is missing. See 'One-time setup' in docs/RELEASING.md."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          yarn build
          yarn electron-builder --mac --x64 --arm64 --publish never -c.forceCodeSigning=true

      # Gatekeeper only opens a notarised app, and macOS only installs an update signed like the copy it
      # replaces. Updates install from the zip, so the app inside it gets the same checks.
      - name: Check the Mac apps are signed, notarised, and complete
        if: runner.os == 'macOS'
        shell: bash
        run: |
          check() {
            codesign --verify --deep --strict --verbose=2 "$1"
            spctl --assess --type execute --verbose=2 "$1"
            xcrun stapler validate "$1"
          }
          version=$(node -p "require('./package.json').version")
          # Copies of 0.8.1 and earlier only read the version, to say there's a new one.
          grep -Fx "version: $version" dist/latest-mac.yml ||
            { echo "::error::latest-mac.yml doesn't give the version as $version"; exit 1; }
          for dir in mac:x64 mac-arm64:arm64; do
            arch=${dir##*:}
            app="dist/${dir%%:*}/GitLantern.app"
            check "$app"
            # git runs the askpass helper as a plain Node script, from outside the asar archive.
            ls "$app/Contents/Resources/app.asar.unpacked/out/main/askpass.js"
            zip="GitLantern-$version-$arch.zip"
            ditto -x -k "dist/$zip" "$RUNNER_TEMP/$arch"
            check "$RUNNER_TEMP/$arch/GitLantern.app"
            # Signed copies download the zip that latest-mac.yml names for their processor.
            grep -F "url: $zip" dist/latest-mac.yml || { echo "::error::latest-mac.yml doesn't list $zip"; exit 1; }
          done

      # Installed copies read latest.yml (Windows), latest-mac.yml or latest-linux.yml to find a new
      # version, and the Windows updater uses the .blockmap files to download only what changed.
      # Without them, nobody gets this release as an update.
      - name: Check the update files were written
        shell: bash
        run: ls dist/latest*.yml

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          tag="refs/tags/$GITHUB_REF_NAME"
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          # An annotated tag's message, after its first line, becomes "What's new". actions/checkout
          # swaps an annotated tag for a plain one, so fetch the real tag to read its message.
          git fetch --quiet --force origin "$tag:$tag"
          if [ "$(git cat-file -t "$tag")" = tag ]; then
            whats_new=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
            if [ -n "$(printf '%s' "$whats_new" | tr -d '[:space:]')" ]; then
              printf "## What's new\n\n%s\n\n" "$whats_new" > "$notes"
            fi
          fi
          sed "s/<version>/$version/g" .github/release-notes.md >> "$notes"
          gh release create "$GITHUB_REF_NAME" installers/* --verify-tag \
            --title "GitLantern $version" --notes-file "$notes" --generate-notes
